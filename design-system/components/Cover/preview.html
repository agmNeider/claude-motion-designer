<!-- @dsCard height=336 -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Cover</title>
<style>
  html, body { margin: 0; background: var(--surface); }
  .cover { position: relative; width: 960px; height: 336px; overflow: hidden; background: var(--surface); }
  .cover svg { position: absolute; left: 0; top: 0; }
  .b-nogal { fill: var(--nogal); }
  .b-ink { fill: var(--ink); }
  .b-tinta { fill: var(--tinta); }
  .b-laton { fill: var(--laton); }
  .blk { rx: var(--radius-lg); }
  .ring-soft { fill: none; stroke: var(--nogal-soft); stroke-width: 2; }
  .ring-laton { fill: none; stroke: var(--laton); stroke-width: 2; }
  .ring-nogal { fill: none; stroke: var(--nogal); stroke-width: 2; }
  .p-soft { fill: var(--nogal-soft); }
  .p-laton { fill: var(--laton); }
  .p-nogal { fill: var(--nogal); }
  .name {
    position: absolute; left: 48px; top: 152px; margin: 0; max-width: 864px;
    font-family: var(--font-display); font-weight: 400; font-size: 64px; line-height: 0.95; color: var(--ink);
  }
  .tag {
    position: absolute; left: 48px; top: 290px; margin: 0; max-width: 440px;
    font-family: var(--font-serif); font-style: italic; font-size: 14px; line-height: 20px; color: var(--ink-muted);
  }
</style></head>
<body>
<div class="cover">
  <svg width="960" height="336" viewBox="0 0 960 336" aria-hidden="true">
    <!--
      blocks: nogal 320×104, ink 256×104, tinta 160×104, laton 160×104 (bleeds right); gaps space-4 (16); corners radius-lg (28)
      arrangement: top-band skeleton (name too wide for the 440px zone) — a strip of unequal bands, largest first, like a row of case folders
      pattern: literal motif, El Sello — the logo's disc and its two rings, as a solid disc of radius-lg (28) with hairline rings at 36 and 44, one seal per block; chosen because the notarial seal is the firm's mark
      scales: space-4 gaps, space-12 (48) inset; disc r = radius-lg 28, rings +space-2 (8) steps; hairline 2px
    -->
    <rect class="blk b-nogal" x="48" y="24" width="320" height="104" />
    <rect class="blk b-ink" x="384" y="24" width="256" height="104" />
    <rect class="blk b-tinta" x="656" y="24" width="160" height="104" />
    <rect class="blk b-laton" x="832" y="24" width="160" height="104" />
    <circle class="p-soft" cx="296" cy="76" r="28" />
    <circle class="ring-soft" cx="296" cy="76" r="36" />
    <circle class="p-laton" cx="568" cy="76" r="28" />
    <circle class="ring-laton" cx="568" cy="76" r="36" />
    <circle class="ring-laton" cx="568" cy="76" r="44" />
    <circle class="ring-soft" cx="760" cy="76" r="28" />
    <circle class="p-nogal" cx="904" cy="76" r="28" />
    <circle class="ring-nogal" cx="904" cy="76" r="36" />
  </svg>
  <h1 class="name">N.A.R. Abogados<br>&amp; Asociados</h1>
  <p class="tag">Tu tranquilidad, nuestra prioridad.</p>
</div>
</body></html>
