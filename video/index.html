<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>N.A.R. — video</title>
<style>
  @font-face { font-family: "Caslon Display"; src: url(../design-system/fonts/LibreCaslonDisplay-Regular.woff2) format("woff2"); }
  @font-face { font-family: "Caslon Text"; font-style: italic; src: url(../design-system/fonts/LibreCaslonText-Italic.woff2) format("woff2"); }
  @font-face { font-family: "Caslon Text"; font-style: normal; src: url(../design-system/fonts/LibreCaslonText-Regular.woff2) format("woff2"); }
  @font-face { font-family: "Hanken"; font-weight: 100 900; src: url(../design-system/fonts/HankenGrotesk-Variable.woff2) format("woff2"); }
  html, body { margin: 0; background: #111; }
  body { display: grid; place-items: center; min-height: 100vh; }
  canvas { width: min(100vw, calc(100vh * 9 / 16)); height: auto; display: block; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 12px; display: flex; gap: 12px; align-items: center;
         font: 13px system-ui, sans-serif; color: #eee; background: rgba(0,0,0,.6); }
  #bar input { flex: 1; }
  body.render #bar { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="bar"><button id="play" type="button">Reproducir</button><input id="seek" type="range" min="0" max="32" step="0.001" value="0"><span id="time">0.00 s</span></div>
<audio id="music" src="out/musica.wav" preload="auto"></audio>
<script src="timeline.js"></script>
<script src="scene.js"></script>
<script>
  // Preview player: scrub or play in sync with the music. The renderer drives renderFrame() instead.
  (async function () {
    await window.SCENE_READY;
    const audio = document.getElementById('music'), seek = document.getElementById('seek'), label = document.getElementById('time');
    const show = (t) => { window.drawFrame(t); seek.value = t; label.textContent = t.toFixed(2) + ' s'; };
    show(0);
    seek.addEventListener('input', () => { audio.currentTime = +seek.value; show(+seek.value); });
    document.getElementById('play').addEventListener('click', () => {
      if (audio.paused) { audio.play(); tick(); } else audio.pause();
    });
    function tick() { show(audio.currentTime); if (!audio.paused) requestAnimationFrame(tick); }
  })();
</script>
</body>
</html>
